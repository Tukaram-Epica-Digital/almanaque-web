<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almanaque CD Remolinos — visor 3D</title>
<style>
 html,body{margin:0;height:100%;background:#14100c;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif}
 #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;color:#c9b795;font-size:13px;display:flex;gap:12px;align-items:center;pointer-events:none;text-shadow:0 1px 4px #000}
 #ui button{pointer-events:auto;background:#2b2117;color:#ead9bd;border:1px solid #55402a;border-radius:7px;padding:7px 14px;cursor:pointer}
 #ui button:hover{background:#3a2c1d}
 #pista{position:fixed;top:14px;left:16px;color:#8d7f6c;font-size:12px;max-width:460px;line-height:1.5}
 #carga{position:fixed;top:14px;right:16px;color:#e07b5a;font-size:12px;text-align:right}
</style>
</head>
<body>
<div id="pista">Arrastra la esquina de una hoja para pasarla · rueda del ratón · flechas ← → ·
Inicio/Fin para ir a la tapa o al final · arrastrar fuera del libro para girarlo</div>
<div id="carga"></div>
<div id="ui">
 <button id="prev">‹ Anterior</button>
 <button id="next">Siguiente ›</button>
 <button id="top">⏮ Inicio</button>
 <button id="end">Final ⏭</button>
 <button id="mute">Sonido: ON</button>
 <span id="page"></span>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ CONFIG ============================ */
const CFG = {
  pageH: 1.36,
  prop:  0.68,          // ancho/alto real medido del cuaderno
  segW: 30, segH: 9,    // segmentos de la malla de las hojas
  paperT: 0.0016,       // grosor de una hoja de papel
  boardT: 0.0090,       // grosor de una tapa rígida
  maxCurl: 0.60,
  win: 4,               // hojas con textura en memoria a cada lado
  manifest: 'paginas/manifest.json',
};
const H = CFG.pageH, W = H * CFG.prop;
const cargaLabel = document.getElementById('carga');

/* ============================ RENDERER ============================ */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14100c);
scene.fog = new THREE.Fog(0x14100c, 6, 14);

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.5, 12);
camera.position.set(0.1, 2.3, 1.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 1.2; controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xbfd0e8, 0x2a1d12, 0.6));
const key = new THREE.DirectionalLight(0xffe6c2, 2.2);
key.position.set(1.8, 3.4, 1.6);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.5; key.shadow.camera.right = 2.5;
key.shadow.camera.top = 2.5;   key.shadow.camera.bottom = -2.5;
key.shadow.bias = -0.00004; key.shadow.normalBias = 0.0015;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8ff, 0.45);
rim.position.set(-2.2, 1.4, -1.8); scene.add(rim);

/* mesa de nogal */
function woodTexture(){
 const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
 g.fillStyle='#4a2f1c'; g.fillRect(0,0,1024,1024);
 for(let i=0;i<2600;i++){
  const y=Math.random()*1024, w=40+Math.random()*400;
  g.strokeStyle='rgba('+(30+Math.random()*70|0)+','+(18+Math.random()*40|0)+',10,'+(0.05+Math.random()*0.12)+')';
  g.lineWidth=0.5+Math.random()*2.5;
  g.beginPath(); g.moveTo(Math.random()*1024,y);
  g.bezierCurveTo(Math.random()*1024,y+Math.random()*8-4,Math.random()*1024,y+Math.random()*8-4,Math.random()*1024+w,y+Math.random()*6-3);
  g.stroke();
 }
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
 return t;
}
const table = new THREE.Mesh(new THREE.PlaneGeometry(14,14),
 new THREE.MeshStandardMaterial({map:woodTexture(),roughness:0.42,metalness:0.05}));
table.rotation.x=-Math.PI/2; table.position.y=0.0; table.receiveShadow=true;
scene.add(table);

/* ============================ WIRE-O DE DOBLE ALAMBRE ============================ */
/* Un único alambre continuo que forma bucles perpendiculares al lomo: cada bucle
   atraviesa la fila de agujeros derecha y la izquierda, y asoma por debajo.
   Al mirarlo se ven dos filas paralelas de alambre = doble alambre. */
function buildWireO(){
 const holes = 28;
 const rx = 0.046;                 // alcance lateral hasta las dos filas de agujeros
 const ry = 0.032;                 // cuánto asoma por encima y por debajo del bloque
 const wire = 0.0062;
 const z0 = -H/2 + 0.028, z1 = H/2 - 0.028;
 const dz = (z1 - z0) / (holes - 1);
 const pts = [];
 for(let i=0;i<holes;i++){
  const z = z0 + i*dz, seg = 26;
  for(let k=0;k<=seg;k++){
   const a = -Math.PI/2 + (k/seg)*Math.PI*2;      // empieza y acaba abajo
   pts.push(new THREE.Vector3(Math.cos(a)*rx, Math.sin(a)*ry, z));
  }
  if(i < holes-1){
   for(let k=1;k<=4;k++)                            // puente inferior entre bucles
    pts.push(new THREE.Vector3(0, -ry, z + dz*(k/4)));
  }
 }
 const curve = new THREE.CatmullRomCurve3(pts);
 const geo = new THREE.TubeGeometry(curve, holes*34, wire, 9, false);
 const mat = new THREE.MeshStandardMaterial({color:0x9a9c9f, metalness:0.92, roughness:0.30});
 const m = new THREE.Mesh(geo, mat);
 m.castShadow = true;
 return m;
}

const book = new THREE.Group();
book.position.y = 0.032;            // el cuaderno apoya sobre su propio alambre
scene.add(book);
book.add(buildWireO());

/* ============================ GEOMETRÍA DE PÁGINA ============================ */
function pageGeo(w,h,sw,sh,back){
 const pos=[],uv=[],idx=[],base=[];
 for(let j=0;j<=sh;j++){ const v=j/sh;
  for(let i=0;i<=sw;i++){ const u=i/sw;
   pos.push(u*w,0,(v-0.5)*h); uv.push(back?1-u:u,1-v); base.push(u,v); } }
 for(let j=0;j<sh;j++) for(let i=0;i<sw;i++){
  const a=j*(sw+1)+i,b=a+1,c=a+sw+1,d=c+1;
  if(back) idx.push(a,b,c,c,b,d); else idx.push(a,c,b,c,d,b); }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(idx);
 g.userData.base=new Float32Array(base);
 g.userData.w=w; g.userData.h=h;
 return g;
}

/* papel genérico para las hojas lejanas (sin textura cargada) */
function paperTex(){
 const c=document.createElement('canvas'); c.width=256; c.height=352; const g=c.getContext('2d');
 g.fillStyle='#e6ddc6'; g.fillRect(0,0,256,352);
 for(let i=0;i<900;i++){
  g.fillStyle='rgba('+(150+Math.random()*60|0)+','+(130+Math.random()*50|0)+','+(95+Math.random()*40|0)+','+(0.02+Math.random()*0.05)+')';
  g.beginPath(); g.arc(Math.random()*256,Math.random()*352,1+Math.random()*3,0,7); g.fill(); }
 const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
 return t;
}
const blankTex = paperTex();
const blank = new THREE.MeshStandardMaterial({map:blankTex, roughness:0.92});

/* ============================ CARGA DE TEXTURAS ============================ */
const loader = new THREE.TextureLoader();
const BASE = 'paginas/';   // donde estan las imagenes (el manifest usa la misma ruta)
const cache = new Map();
let cargando = 0;
function loadTex(name, apply){
 if(!name) return;
 if(cache.has(name)){ apply(cache.get(name)); return; }
 cargando++; cargaLabel.textContent = 'cargando… ' + cargando;
 loader.load(BASE+name+'_b.webp', t0 => {
  t0.colorSpace=THREE.SRGBColorSpace; t0.anisotropy=ANISO;
  cache.set(name,t0); apply(t0);
  loader.load(BASE+name+'.webp', t1 => {
   t1.colorSpace=THREE.SRGBColorSpace; t1.anisotropy=ANISO;
   cache.set(name,t1); apply(t1); t0.dispose();
   if(--cargando<=0) cargaLabel.textContent='';
  }, undefined, () => { if(--cargando<=0) cargaLabel.textContent=''; });
 }, undefined, () => {
  loader.load(BASE+name+'_b.webp', t0 => {
   t0.colorSpace=THREE.SRGBColorSpace; t0.anisotropy=ANISO;
   cache.set(name,t0); apply(t0);
   if(--cargando<=0) cargaLabel.textContent='';
  }, undefined, () => { if(--cargando<=0) cargaLabel.textContent=''; });
 });
}
function soltar(name){
 if(name && cache.has(name)){ cache.get(name).dispose(); cache.delete(name); }
}

/* ============================ MANIFEST ============================ */
let pages = [];
try{
 const r = await fetch(CFG.manifest);
 if(!r.ok) throw new Error('HTTP '+r.status);
 pages = (await r.json()).pages || [];
}catch(e){
 cargaLabel.textContent = 'ERROR leyendo manifest: '+e.message+
  '\nAbre con "python -m http.server" desde la carpeta web\\';
}

/* ============================ HOJAS ============================ */
/* La primera y la última hoja del cuaderno son TAPAS RÍGIDAS: no se curvan,
   son algo más grandes y más gruesas que el papel. */
const nSheets = Math.ceil(pages.length/2);
const sheets = [];
for(let i=0;i<nSheets;i++){
 const rigid = (i===0) || (i===nSheets-1);
 const w = rigid ? W+0.012 : W;
 const h = rigid ? H+0.016 : H;
 const sw = rigid ? 2 : CFG.segW, sh = rigid ? 2 : CFG.segH;
 const gF = pageGeo(w,h,sw,sh,false);
 const gB = pageGeo(w,h,sw,sh,true);
 const mF = new THREE.Mesh(gF, blank), mB = new THREE.Mesh(gB, blank);
 mF.castShadow = mB.castShadow = false;
 const grp = new THREE.Group(); grp.add(mF,mB); book.add(grp);
 sheets.push({grp,mF,mB,gF,gB,w,rigid,th: rigid?CFG.boardT:CFG.paperT,
              t:0, target:null, auto:false,
              nameF:pages[2*i], nameB:pages[2*i+1]});
}

/* alturas acumuladas para que la pila de papel apoya correctamente */
const cum = [0];
sheets.forEach((s,i)=>cum.push(cum[i]+s.th*1.3));   // paso 30% mayor: evita caras coplanares

/* ============================ DEFORMACIÓN ============================ */
function deform(geo, A, phi, lift){
 const base=geo.userData.base, pos=geo.attributes.position, w=geo.userData.w;
 const small = Math.abs(phi) < 1e-4;
 for(let k=0;k<pos.count;k++){
  const u=base[k*2], v=base[k*2+1]; let x,y;
  if(small){ x=u*w*Math.cos(A); y=u*w*Math.sin(A); }
  else{ x=(w/phi)*(Math.sin(A)-Math.sin(A-phi*u)); y=(w/phi)*(Math.cos(A-phi*u)-Math.cos(A)); }
  pos.setXYZ(k, x, y+lift, (v-0.5)*geo.userData.h);
 }
 pos.needsUpdate = true;
 geo.computeVertexNormals();
}

let flipped = 0, turning = null;

function restLift(i,t){
 // pila derecha (sin pasar): se apoya en la mesa, la proxima a pasar queda arriba
 const L = cum[nSheets] - cum[i+1];
 // pila izquierda (ya pasadas): se apoya en la mesa, la ultima pasada queda arriba
 const R = cum[i];
 if(t<=0) return L;
 if(t>=1) return R;
 const e = 0.06;
 if(t < e)   return L + (0.04-L)*(t/e);
 if(t > 1-e) return R + (0.04-R)*((1-t)/e);
 return 0.04;
}

/* Solo se deforman las hojas visibles: con 69 hojas eso es ~14x menos trabajo
   por frame que recalcular toda la malla. */
function updateSheets(){
 for(let i=0;i<sheets.length;i++){
  const s = sheets[i], t = s.t;
  const vis = (t>0 ? i>=flipped-1 : i<=flipped+1) || (s===turning);
  s.grp.visible = vis;
  if(!vis) continue;
  const A = t*Math.PI;
  const phi = s.rigid ? 0 : CFG.maxCurl*Math.sin(Math.PI*Math.min(Math.max(t,0),1));
  const lift = restLift(i,t);
  deform(s.gF, A, phi, lift);
  deform(s.gB, A, phi, lift - s.th*Math.cos(A));
 }
}

/* ventana de memoria: solo las hojas cercanas llevan textura */
function setTex(mesh, name){
 if(!name) return;
 const m = new THREE.MeshStandardMaterial({map:blankTex, roughness:0.92});
 mesh.material = m;
 loadTex(name, t => { m.map = t; m.needsUpdate = true; });
}
function updateWindow(){
 const lo = Math.max(0, flipped-CFG.win), hi = Math.min(sheets.length-1, flipped+CFG.win);
 for(let i=0;i<sheets.length;i++){
  const s = sheets[i], inside = i>=lo && i<=hi;
  if(inside){
   if(s.mF.material===blank) setTex(s.mF, s.nameF);
   if(s.mB.material===blank) setTex(s.mB, s.nameB);
  } else {
   if(s.mF.material!==blank){ s.mF.material.dispose(); s.mF.material=blank; soltar(s.nameF); }
   if(s.mB.material!==blank){ s.mB.material.dispose(); s.mB.material=blank; soltar(s.nameB); }
  }
 }
}

/* ============================ SONIDO ============================ */
let actx=null, master=null, noiseBuf=null, muted=false;
function audioInit(){
 if(actx) return;
 actx = new (window.AudioContext||window.webkitAudioContext)();
 master = actx.createGain(); master.gain.value = 0.9;
 const comp = actx.createDynamicsCompressor();
 master.connect(comp).connect(actx.destination);
 const sr = actx.sampleRate;
 noiseBuf = actx.createBuffer(1, sr, sr);
 const d = noiseBuf.getChannelData(0);
 for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}
function pageSound(intensity, rate){
 intensity = intensity||1; rate = rate||1;
 if(muted) return; audioInit();
 const t0 = actx.currentTime;
 const src = actx.createBufferSource(); src.buffer=noiseBuf; src.playbackRate.value=0.85*rate;
 const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.7;
 const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
 const g  = actx.createGain();
 bp.frequency.setValueAtTime(900,t0);
 bp.frequency.exponentialRampToValueAtTime(3200*rate, t0+0.09);
 bp.frequency.exponentialRampToValueAtTime(700, t0+0.42);
 const amp = 0.30*Math.min(intensity,1.4);
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.exponentialRampToValueAtTime(amp,t0+0.045);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+0.45);
 src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
 src.start(t0); src.stop(t0+0.5);
 for(let k=0;k<3;k++){
  const tt = t0+0.10+k*0.09+Math.random()*0.05;
  const s2 = actx.createBufferSource(); s2.buffer=noiseBuf; s2.playbackRate.value=1.3+Math.random()*0.6;
  const f2 = actx.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=1800+Math.random()*1500; f2.Q.value=1.6;
  const g2 = actx.createGain();
  g2.gain.setValueAtTime(0.0001,tt);
  g2.gain.exponentialRampToValueAtTime(amp*0.35,tt+0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001,tt+0.10);
  s2.connect(f2); f2.connect(g2); g2.connect(master);
  s2.start(tt); s2.stop(tt+0.12);
 }
}
function thud(v){
 if(muted) return; audioInit();
 const t0 = actx.currentTime;
 const o = actx.createOscillator(); o.type='sine';
 o.frequency.setValueAtTime(120,t0); o.frequency.exponentialRampToValueAtTime(55,t0+0.12);
 const g = actx.createGain();
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.exponentialRampToValueAtTime(0.16*(v||0.5),t0+0.01);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
 o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.22);
}

/* ============================ INTERACCIÓN ============================ */
function turnForward(){
 if(turning || flipped>=sheets.length) return;
 turning = sheets[flipped]; turning.t=0; turning.target=1; turning.auto=true;
 pageSound(0.7,1.0);
}
function turnBack(){
 if(turning || flipped<=0) return;
 turning = sheets[flipped-1]; turning.t=1; turning.target=0; turning.auto=true;
 pageSound(0.6,0.9);
}
/* salto directo a tapa o final, sin animación */
function goTop(){
 if(turning) return;
 sheets.forEach(s=>{s.t=0; s.target=null; s.auto=false;});
 flipped=0; pageSound(0.4,0.8);
}
function goEnd(){
 if(turning) return;
 sheets.forEach(s=>{s.t=1; s.target=null; s.auto=false;});
 flipped=sheets.length; pageSound(0.4,0.8);
}

document.getElementById('next').onclick = turnForward;
document.getElementById('prev').onclick = turnBack;
document.getElementById('top').onclick = goTop;
document.getElementById('end').onclick = goEnd;
document.getElementById('mute').onclick = e => {
 muted = !muted; e.target.textContent = 'Sonido: ' + (muted?'OFF':'ON');
};

let drag = null; const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
 audioInit(); if(turning) return;
 ndc.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
 const right = ndc.x>0, i = right ? flipped : flipped-1;
 if(i<0 || i>=sheets.length) return;
 drag = {i, right, x0:e.clientX, t0:sheets[i].t};
 turning = sheets[i]; turning.auto=false; turning.soundPlayed=false;
 controls.enabled = false; renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
 if(!drag) return;
 drag.x1=e.clientX;
 const span = innerWidth*0.34;
 const dx = drag.right ? (drag.x0-e.clientX) : (e.clientX-drag.x0);
 const t = Math.min(Math.max(drag.t0+dx/span, 0), 1);
 if(!turning.soundPlayed && t>0.12){ pageSound(0.55+Math.abs(t-drag.t0), 0.95); turning.soundPlayed=true; }
 turning.t = t;
});
addEventListener('pointerup', () => {
 if(!drag) return;
 controls.enabled = true;
 const t = turning.t;
 const mov = Math.abs((drag.x1===undefined?drag.x0:drag.x1) - drag.x0);
 const go = mov < 14 ? drag.right : t > 0.45;
 turning.target = go?1:0; turning.auto = true;
 const vel = Math.abs(t-drag.t0);
 pageSound(0.5+vel*1.2, 0.9+vel*0.8);
 setTimeout(()=>thud(go?0.6:0.3), go?260:200);
 drag = null;
});
addEventListener('wheel', e => { e.deltaY>0 ? turnForward() : turnBack(); }, {passive:true});
addEventListener('keydown', e => {
 if(e.key==='ArrowRight') turnForward();
 else if(e.key==='ArrowLeft') turnBack();
 else if(e.key==='Home') goTop();
 else if(e.key==='End')  goEnd();
});

/* ============================ BUCLE ============================ */
const pageLabel = document.getElementById('page');
let lastFlipped = -1;
function tick(){
 requestAnimationFrame(tick);
 if(turning && turning.auto){
  const d = turning.target - turning.t;
  turning.t += d * (turning.target>turning.t ? 0.10 : 0.14);
  if(Math.abs(d) < 0.004){
   turning.t = turning.target;
   if(turning.target===1) flipped++; else flipped--;
   turning = null;
  }
 }
 if(flipped !== lastFlipped){ lastFlipped = flipped; updateWindow(); }
 updateSheets();
 pageLabel.textContent = 'páginas ' + pages.length + '   ·   hoja ' +
   Math.min(flipped+1, sheets.length) + ' / ' + sheets.length;
 controls.update();
 renderer.render(scene, camera);
}
updateWindow(); updateSheets(); tick();

addEventListener('resize', () => {
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
